<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Färgklickar</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0d0d1a 100%);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #hint {
    position: fixed;
    top: 14px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.55);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 0.3px;
    pointer-events: none;
    transition: opacity 1.5s ease;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="hint">Tryck på en klick för att byta färg · Dra isär med två fingrar för att dela</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const MIN_R = 16;
const MAX_SPEED = 0.35;

function randHue() { return Math.random() * 360; }

function makeBlob(x, y, r, hue) {
  return {
    id: Math.random().toString(36).slice(2),
    x, y, r,
    vx: (Math.random() - 0.5) * MAX_SPEED,
    vy: (Math.random() - 0.5) * MAX_SPEED,
    hue,
    wobble: Math.random() * Math.PI * 2
  };
}

let blobs = [];
const COUNT = 42;
for (let i = 0; i < COUNT; i++) {
  const r = 24 + Math.random() * 46;
  blobs.push(makeBlob(
    Math.random() * W,
    Math.random() * H,
    r,
    randHue()
  ));
}

function step() {
  for (const b of blobs) {
    b.wobble += 0.01 + Math.random() * 0.01;
    b.vx += (Math.random() - 0.5) * 0.015 + Math.sin(b.wobble) * 0.003;
    b.vy += (Math.random() - 0.5) * 0.015 + Math.cos(b.wobble * 0.8) * 0.003;
    const speed = Math.hypot(b.vx, b.vy);
    if (speed > MAX_SPEED) {
      b.vx = (b.vx / speed) * MAX_SPEED;
      b.vy = (b.vy / speed) * MAX_SPEED;
    }
    b.x += b.vx;
    b.y += b.vy;

    if (b.x < -b.r) b.x = W + b.r;
    if (b.x > W + b.r) b.x = -b.r;
    if (b.y < -b.r) b.y = H + b.r;
    if (b.y > H + b.r) b.y = -b.r;
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (const b of blobs) {
    const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 1.6);
    grad.addColorStop(0, `hsla(${b.hue}, 80%, 60%, 0.85)`);
    grad.addColorStop(0.45, `hsla(${b.hue}, 80%, 55%, 0.55)`);
    grad.addColorStop(0.8, `hsla(${b.hue}, 80%, 50%, 0.15)`);
    grad.addColorStop(1, `hsla(${b.hue}, 80%, 50%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 1.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function loop() {
  step();
  draw();
  requestAnimationFrame(loop);
}
loop();

function blobAt(x, y) {
  let best = null, bestD = Infinity;
  for (const b of blobs) {
    const d = Math.hypot(b.x - x, b.y - y);
    if (d <= b.r * 1.3 && d < bestD) { best = b; bestD = d; }
  }
  return best;
}

// ---- Tap = byt färg (touch + mus) ----
let tapStart = null;
function onTapStart(x, y) {
  tapStart = { x, y, t: Date.now() };
}
function onTapEnd(x, y) {
  if (!tapStart) return;
  const moved = Math.hypot(x - tapStart.x, y - tapStart.y);
  const dt = Date.now() - tapStart.t;
  if (moved < 10 && dt < 400) {
    const b = blobAt(x, y);
    if (b) {
      let newHue = b.hue;
      while (Math.abs(newHue - b.hue) < 60) newHue = randHue();
      b.hue = newHue;
    }
  }
  tapStart = null;
}

canvas.addEventListener('mousedown', e => onTapStart(e.clientX, e.clientY));
canvas.addEventListener('mouseup', e => onTapEnd(e.clientX, e.clientY));

// ---- Två fingrar = dela ----
let activeSplit = null;
const SPLIT_THRESHOLD = 55;

function dist(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }

function doSplit(b, ax, ay, bx, by) {
  const idx = blobs.indexOf(b);
  if (idx === -1) return;
  const newR = b.r / Math.SQRT2;
  if (newR < MIN_R) return;

  blobs.splice(idx, 1);

  const dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;

  const hue1 = b.hue + (Math.random() * 20 - 10);
  const hue2 = b.hue + (Math.random() * 20 - 10);

  const c1 = makeBlob(ax, ay, newR, hue1);
  const c2 = makeBlob(bx, by, newR, hue2);
  c1.vx = -ux * 0.6 + (Math.random() - 0.5) * 0.2;
  c1.vy = -uy * 0.6 + (Math.random() - 0.5) * 0.2;
  c2.vx = ux * 0.6 + (Math.random() - 0.5) * 0.2;
  c2.vy = uy * 0.6 + (Math.random() - 0.5) * 0.2;

  blobs.push(c1, c2);
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    onTapStart(e.touches[0].clientX, e.touches[0].clientY);
  } else if (e.touches.length === 2) {
    tapStart = null;
    const t0 = e.touches[0], t1 = e.touches[1];
    const mx = (t0.clientX + t1.clientX) / 2;
    const my = (t0.clientY + t1.clientY) / 2;
    let b = blobAt(mx, my) || blobAt(t0.clientX, t0.clientY) || blobAt(t1.clientX, t1.clientY);
    if (b) {
      activeSplit = {
        blob: b,
        id0: t0.identifier,
        id1: t1.identifier,
        startDist: dist(t0, t1),
        done: false
      };
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (activeSplit && !activeSplit.done && e.touches.length >= 2) {
    let t0 = null, t1 = null;
    for (const t of e.touches) {
      if (t.identifier === activeSplit.id0) t0 = t;
      if (t.identifier === activeSplit.id1) t1 = t;
    }
    if (t0 && t1) {
      const d = dist(t0, t1);
      if (d - activeSplit.startDist > SPLIT_THRESHOLD) {
        activeSplit.done = true;
        doSplit(activeSplit.blob, t0.clientX, t0.clientY, t1.clientX, t1.clientY);
      }
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if (e.touches.length === 0 && tapStart) {
    const t = e.changedTouches[0];
    onTapEnd(t.clientX, t.clientY);
  }
  if (e.touches.length < 2) {
    activeSplit = null;
  }
}, { passive: false });

// Tona bort instruktionen
setTimeout(() => {
  const h = document.getElementById('hint');
  h.style.opacity = '0';
}, 3500);
</script>
</body>
</html>
