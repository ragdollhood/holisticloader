<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Holistic Loader - Clean Menu Concept</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;height:100vh;overflow:hidden;background:#111;color:white}
.bg{position:fixed;inset:0;background:url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=2000") center/cover no-repeat}
.bg:after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sidebar{position:fixed;left:0;top:0;height:100%;width:250px;background:rgba(10,10,15,.82);backdrop-filter:blur(18px);padding:14px;border-right:1px solid rgba(255,215,0,.2);transition:.35s;z-index:10}
.sidebar.collapsed{width:80px}
.toggle{width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:white;font-size:24px;cursor:pointer}
.nav{margin-top:25px;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:15px;border-radius:16px;text-decoration:none;color:white;transition:.25s}
.item:hover,.item.active{background:rgba(255,215,0,.12)}
.icon{font-size:24px;min-width:24px;text-align:center}
.sidebar.collapsed .label{display:none}
.main{margin-left:250px;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;transition:.35s;z-index:2}
.main.expanded{margin-left:80px}
.logo{font-size:clamp(40px,6vw,90px);color:#e7c37a;text-shadow:0 0 20px rgba(231,195,122,.6);margin-bottom:40px}
.start{padding:22px 80px;border:none;border-radius:20px;background:linear-gradient(#f2cf84,#c78a30);font-size:32px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.bottom{position:absolute;bottom:20px;width:90%}
.section{margin-top:15px}
.section h3{text-align:center;color:#e7c37a;margin-bottom:8px;letter-spacing:2px}
.row{display:flex;gap:10px;overflow:auto;padding-bottom:4px}
.card{min-width:120px;height:75px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15)}
</style>
</head>
<body>
<div class="bg"></div>
<div id="sidebar" class="sidebar">
<button class="toggle" id="toggle">☰</button>
<div class="nav">
<a href="#" class="item active"><span class="icon">🫁</span><span class="label">Breathe</span></a>
<a href="#" class="item"><span class="icon">🎵</span><span class="label">Sound Healing</span></a>
<a href="#" class="item"><span class="icon">🌿</span><span class="label">Places</span></a>
<a href="#" class="item"><span class="icon">🥗</span><span class="label">Nutrition</span></a>
<a href="#" class="item"><span class="icon">⭐</span><span class="label">Premium</span></a>
<a href="#" class="item"><span class="icon">🛒</span><span class="label">Shop</span></a>
<a href="#" class="item"><span class="icon">⚙️</span><span class="label">Settings</span></a>
</div>
</div>
<div id="main" class="main">
<div class="logo">HOLISTIC LOADER</div>
<button class="start">START</button>
<div class="bottom">
<div class="section"><h3>MY PLACE</h3><div class="row"><div class="card">Forest</div><div class="card">Beach</div><div class="card">Mountains</div><div class="card">Universe</div></div></div>
<div class="section"><h3>MY SOUND</h3><div class="row"><div class="card">Quartz Bowl</div><div class="card">Gong</div><div class="card">Flute</div><div class="card">Rainstick</div></div></div>
<div class="section"><h3>MY FREQUENCY</h3><div class="row"><div class="card">432 Hz</div><div class="card">528 Hz</div><div class="card">741 Hz</div></div></div>
</div>
</div>
<script>
const s=document.getElementById('sidebar');
const m=document.getElementById('main');
document.getElementById('toggle').onclick=()=>{
 s.classList.toggle('collapsed');
 m.classList.toggle('expanded');
};
</script>
</body>
</html>
